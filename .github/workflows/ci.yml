name: CI Pipeline - B1 Integration Hub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mock-service-layer/package-lock.json

      - name: Install dependencies & Build Mock Server
        run: |
          cd mock-service-layer
          npm ci
          npm run build

      - name: Verify Groovy Integration Scripts syntax
        run: |
          echo "Verifying Groovy scripts for SAP Cloud Integration..."
          test -f iflows/scripts/SessionCacheManager.groovy
          test -f iflows/scripts/CaptureLoginSession.groovy
          test -f iflows/scripts/PayloadTransformer.groovy
          echo "All integration scripts verified successfully."
